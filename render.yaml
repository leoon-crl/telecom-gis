# ── ART TELECOM GIS — Blueprint Render 100% GRATUIT (API Render + BD Neon) ──
services:
  # ── Backend FastAPI (Docker, plan gratuit) ──
  - type: web
    name: art-telecom-gis-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    # Pas de preDeployCommand (non supporté en Free) :
    # PostGIS + tables + données démo créés automatiquement au démarrage (main.py)
    envVars:
      - key: DATABASE_URL
        sync: false          # ← sera renseigné manuellement (URL Neon)
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 480
      - key: CORS_ORIGINS
        value: https://art-telecom-gis.onrender.com,http://localhost:5173,http://localhost:3000

  # ── Frontend React (site statique, gratuit — PAS de champ plan) ──
  - type: web
    name: art-telecom-gis
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false          # ← sera renseigné manuellement (URL de l'API)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
